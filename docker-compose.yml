services:
  db:
    image: postgres:17-alpine
    container_name: efg-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    shm_size: 256mb

    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: bib01
      POSTGRES_DB: biblioteca

    volumes:
      - pg_data:/var/lib/postgres/pg_data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  pg_data:
